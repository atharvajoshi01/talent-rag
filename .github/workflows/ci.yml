name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout into talent_rag/
        uses: actions/checkout@v4
        with:
          path: talent_rag

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: talent_rag/requirements.txt

      - name: Install dependencies
        working-directory: talent_rag
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install ruff

      - name: Lint with ruff
        working-directory: talent_rag
        run: |
          ruff check . --exclude __pycache__ --exclude data --exclude docker

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest talent_rag/tests/ -v --tb=short
